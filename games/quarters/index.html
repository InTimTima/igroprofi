<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Клеточки — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    #quads {
      background: var(--sea);
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      overflow: hidden;
    }
    #quads .quad {
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage" id="stage">
      <div class="quads" id="quads">
        <div class="quad"></div>
        <div class="quad"></div>
        <div class="quad"></div>
        <div class="quad"></div>
      </div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const quads = Array.from(document.querySelectorAll('.quad'));
    let count = 1;

    function createCountControl(container) {
      const wrapper = document.createElement('div');
      wrapper.className = 'control-group';

      const label = document.createElement('label');
      label.className = 'control-label';
      label.textContent = t('squares');

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = '1';
      slider.max = '4';
      slider.step = '1';
      slider.value = '1';

      const ticks = document.createElement('div');
      ticks.className = 'speed-ticks';
      [1, 2, 3, 4].forEach(function (value) {
        const tick = document.createElement('span');
        tick.textContent = String(value);
        ticks.appendChild(tick);
      });

      slider.addEventListener('input', function () {
        count = Number(slider.value);
        if (Interactive.active) tick(false);
      });

      wrapper.append(label, slider, ticks);
      container.appendChild(wrapper);
    }

    function tick(silent) {
      if (!silent) {
        triggerChangeAnimation(stage);
        quads.forEach(function (quad) {
          quad.classList.remove('flash-bg');
        });
        void stage.offsetWidth;
        quads.forEach(function (quad) {
          quad.classList.add('flash-bg');
        });
      }
      quads.forEach(function (quad) {
        quad.style.backgroundColor = '#ffffff';
      });
      const chosen = shuffle([0, 1, 2, 3]).slice(0, count);
      chosen.forEach(function (index) {
        quads[index].style.backgroundColor = IGRO_COLORS[randomColorKey()];
      });
    }

    mountGameShell({
      gameId: 'quarters',
      titleKey: 'quarters',
      tick: tick,
      reset: function () {
        quads.forEach(function (quad) {
          quad.style.backgroundColor = '#ffffff';
        });
      },
      setupControls: function (startCol, endCol) {
        createCountControl(endCol);
      },
      methodica:
        '<p>На экране четыре белые клетки. При каждой смене одна или несколько клеток закрашиваются случайным цветом.</p>' +
        '<ul>' +
        '<li>Покажите ребёнку, какие клетки изменились, и назовите их цвета.</li>' +
        '<li>Просите ребёнка найти все клетки одного цвета и накрыть их ладошкой.</li>' +
        '<li>Называйте цвет, а ребёнок показывает на соответствующую клетку.</li>' +
        '<li>Спрашивайте, сколько клеток закрасилось на этот раз, и учите считать.</li>' +
        '<li>Положите перед ребёнком предметы в цветах экрана — пусть берёт предмет того цвета, который закрашен.</li>' +
        '<li>Выполняйте движения по цвету клетки: красный — хлопаем, синий — топаем, жёлтый — приседаем, зелёный — прыгаем.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
