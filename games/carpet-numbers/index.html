<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Счет 1-10 — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    #stage {
      padding-top: 3.4rem;
    }

    #quads {
      border-radius: 16px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage" id="stage">
      <div class="quads quads--carpet" id="quads">
        <div class="quad"></div>
        <div class="quad"></div>
        <div class="quad"></div>
        <div class="quad"></div>
      </div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const quads = Array.from(document.querySelectorAll('.quad'));
    let nextNumber = 1;

    function tick(silent) {
      triggerChangeAnimation(stage, silent);
      quads.forEach(function (quad) {
        quad.innerHTML = '';
      });
      const el = document.createElement('span');
      el.className = 'quad-number';
      el.textContent = String(nextNumber);
      quads[randomInt(0, 3)].appendChild(el);
      nextNumber = nextNumber >= 10 ? 1 : nextNumber + 1;
    }

    mountGameShell({
      gameId: 'carpet-numbers',
      titleKey: 'carpetNumbers',
      tick: tick,
      reset: function () {
        nextNumber = 1;
        quads.forEach(function (quad) {
          quad.innerHTML = '';
        });
      },
      methodica:
        '<p>На ковре из четырёх цветов по очереди появляются цифры от 1 до 10. Каждая цифра встаёт на случайную четверть.</p>' +
        '<ul>' +
        '<li>Просите ребёнка называть цифру, которая появилась на экране.</li>' +
        '<li>Пусть ребёнок отхлопывает количество хлопков, равное цифре на экране.</li>' +
        '<li>Просите показать пальчиком цифру в воздухе или на карточке.</li>' +
        '<li>Показывайте цифру — ребёнок прыгает столько же раз.</li>' +
        '<li>Считайте вместе вслух: «один, два, три…» до цифры на экране.</li>' +
        '<li>Прячьте карточки с цифрами — пусть ребёнок найдёт такую же, как на экране.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
