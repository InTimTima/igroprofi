<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ножки — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    .feet-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4%;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: visible;
    }

    .foot {
      height: 94%;
      width: auto;
      aspect-ratio: 1;
      max-width: 50%;
      max-height: 94%;
      transition: transform 0.25s ease;
    }

    .feet-container.dual .foot {
      max-width: 43%;
    }

    @media (max-width: 760px) {
      .foot {
        height: 100%;
        max-height: 100%;
        max-width: 100%;
      }

      .feet-container.dual .foot {
        max-width: 86%;
      }
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage game__stage--art" id="stage">
      <div class="feet-container" id="feet-container">
        <div class="foot limb art-shape" id="foot-a"></div>
        <div class="foot limb art-shape" id="foot-b" hidden></div>
      </div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const ASSETS = {
      left: '../../assets/feet/foot-left.svg',
      right: '../../assets/feet/foot-right.svg',
    };

    const container = document.getElementById('feet-container');
    const footA = document.getElementById('foot-a');
    const footB = document.getElementById('foot-b');
    let dualMode = false;
    let randomMode = false;

    function tick(silent) {
      triggerChangeAnimation(container, silent);

      if (!dualMode) {
        footB.hidden = true;
        container.classList.remove('dual');
        container.style.flexDirection = 'row';
        paintAsset(footA, ASSETS[randomItem(['left', 'right'])], IGRO_COLORS[randomColorKey()]);
        return;
      }

      footB.hidden = false;
      container.classList.add('dual');
      if (randomMode) {
        container.style.flexDirection = Math.random() < 0.5 ? 'row-reverse' : 'row';
      } else {
        container.style.flexDirection = 'row';
      }
      paintAsset(footA, ASSETS.left, IGRO_COLORS[randomColorKey()]);
      paintAsset(footB, ASSETS.right, IGRO_COLORS[randomColorKey()]);
    }

    mountGameShell({
      gameId: 'heels',
      titleKey: 'heels',
      tick: tick,
      reset: function () {
        footA.innerHTML = '';
        footB.innerHTML = '';
      },
      setupControls: function (startCol, endCol) {
        createPairSwitch(startCol, {
          leftKey: 'legsNoCross',
          rightKey: 'legsRandom',
          checked: false,
          onChange: function (checked) {
            randomMode = checked;
            if (Interactive.active) tick(false);
          },
        });
        createPairSwitch(endCol, {
          leftKey: 'oneHeel',
          rightKey: 'twoHeels',
          checked: false,
          onChange: function (checked) {
            dualMode = checked;
            if (Interactive.active) tick(false);
          },
        });
      },
      methodica:
        '<p>На белом фоне появляются ножки. Цвет, сторона и расположение меняются при каждой смене.</p>' +
        '<ul>' +
        '<li>Просите ребёнка показать, где левая, а где правая ножка.</li>' +
        '<li>Назовите цвет ножки — пусть ребёнок найдёт предмет такого же цвета.</li>' +
        '<li>Покажите ребёнку, как ставить ножки: как на экране — перекрестить или поставить рядом.</li>' +
        '<li>Положите на пол следы — пусть ребёнок встанет на них, как ножки на экране.</li>' +
        '<li>В режиме «без перекреста» правая ножка всегда справа, левая слева.</li>' +
        '<li>Просите топнуть левой или правой ножкой в цвет, который на экране.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
