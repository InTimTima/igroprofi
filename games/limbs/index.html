<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ножки-ладошки — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    #stage {
      padding-top: 3.4rem;
    }

    .quad .limb {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      transform: scale(1.85);
      transform-origin: center center;
    }

    @media (max-width: 760px) {
      .quad .limb--hand {
        transform: scale(1.48);
      }
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage" id="stage">
      <div class="quads quads--carpet" id="quads">
        <div class="quad"></div>
        <div class="quad"></div>
        <div class="quad"></div>
        <div class="quad"></div>
      </div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const ASSETS = {
      hand: {
        left: '../../assets/hands/hand-left.svg',
        right: '../../assets/hands/hand-right.svg',
      },
      foot: {
        left: '../../assets/feet/foot-left.svg',
        right: '../../assets/feet/foot-right.svg',
      },
    };

    const stage = document.getElementById('stage');
    const quads = Array.from(document.querySelectorAll('.quad'));
    const WHITE = '#ffffff';
    let bothMode = false;

    function buildLimb(kind, side) {
      const el = document.createElement('div');
      el.className = 'limb' + (kind === 'hand' ? ' limb--hand' : '');
      paintAsset(el, ASSETS[kind][side], WHITE, { pad: 0 });
      return el;
    }

    function tick(silent) {
      triggerChangeAnimation(stage, silent);
      quads.forEach(function (quad) {
        quad.innerHTML = '';
      });

      const slots = shuffle([0, 1, 2, 3]);
      if (!bothMode) {
        const kind = randomItem(['hand', 'foot']);
        const side = randomItem(['left', 'right']);
        quads[slots[0]].appendChild(buildLimb(kind, side));
        return;
      }

      const hand = buildLimb('hand', randomItem(['left', 'right']));
      const foot = buildLimb('foot', randomItem(['left', 'right']));
      quads[slots[0]].appendChild(hand);
      quads[slots[1]].appendChild(foot);
    }

    mountGameShell({
      gameId: 'limbs',
      titleKey: 'limbs',
      tick: tick,
      reset: function () {
        quads.forEach(function (quad) {
          quad.innerHTML = '';
        });
      },
      setupControls: function (startCol, endCol) {
        createPairSwitch(endCol, {
          leftKey: 'oneLimb',
          rightKey: 'bothLimb',
          checked: false,
          onChange: function (checked) {
            bothMode = checked;
            if (Interactive.active) tick(false);
          },
        });
      },
      methodica:
        '<p>На цветном ковре появляются ладошки и ножки — одна конечность или ладошка с ножкой.</p>' +
        '<ul>' +
        '<li>Просите ребёнка показать, где ладошка, а где ножка.</li>' +
        '<li>Пусть ребёнок покажет левую и правую руку или ногу по образцу на экране.</li>' +
        '<li>Называйте цвет четверти — ребёнок находит её на ковре перед собой.</li>' +
        '<li>Встаньте на коврик или пол с такими же метками и повторяйте картинку с экрана.</li>' +
        '<li>Режим «одна рука или нога» — учим различать конечности и стороны по очереди.</li>' +
        '<li>Режим «и рука и нога» — учим одновременно выполнять два действия.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
