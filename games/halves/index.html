<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Половинки — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage" id="stage">
      <div class="split-screen" id="split">
        <div class="split-pane" id="half-a"></div>
        <div class="split-pane" id="half-b"></div>
      </div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const split = document.getElementById('split');
    const halfA = document.getElementById('half-a');
    const halfB = document.getElementById('half-b');
    let unique = false;
    let horizontal = false;

    function applyLayout() {
      split.classList.toggle('split-screen--horizontal', horizontal);
    }

    function tick(silent) {
      if (!silent) {
        triggerChangeAnimation(split);
        halfA.classList.remove('flash-bg');
        halfB.classList.remove('flash-bg');
        void split.offsetWidth;
        halfA.classList.add('flash-bg');
        halfB.classList.add('flash-bg');
      }
      const colors = pickColors(2, unique);
      halfA.style.backgroundColor = IGRO_COLORS[colors[0]];
      halfB.style.backgroundColor = IGRO_COLORS[colors[1]];
    }

    mountGameShell({
      gameId: 'halves',
      titleKey: 'halves',
      tick: tick,
      reset: function () {
        halfA.style.backgroundColor = '';
        halfB.style.backgroundColor = '';
      },
      setupControls: function (startCol, endCol) {
        createPairSwitch(startCol, {
          leftKey: 'colorsRepeat',
          rightKey: 'colorsUnique',
          checked: false,
          onChange: function (checked) {
            unique = checked;
            if (Interactive.active) tick(false);
          },
        });
        createPairSwitch(endCol, {
          leftKey: 'vertical',
          rightKey: 'horizontal',
          checked: false,
          onChange: function (checked) {
            horizontal = checked;
            applyLayout();
            if (Interactive.active) tick(false);
          },
        });
      },
      methodica:
        '<p>Экран разделён пополам, и каждая половина меняет цвет независимо друг от друга.</p>' +
        '<ul>' +
        '<li>Показывайте на половину, которая изменилась, и называйте её цвет.</li>' +
        '<li>Просите ребёнка найти предмет цвета верхней (левой) половины.</li>' +
        '<li>Пусть ребёнок встанет на коврик того цвета, который на экране.</li>' +
        '<li>Спрашивайте: половинки одного цвета или разные?</li>' +
        '<li>Выполняйте движения по цвету каждой половины по очереди.</li>' +
        '<li>Режим «вертикально»/«горизонтально» помогает закрепить понятия «верх-низ» и «лево-право».</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
