<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кубики — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    #dice {
      width: min(42%, 360px);
      height: min(70%, 360px);
      max-width: 360px;
      max-height: 70%;
      color: #E53935;
      overflow: visible;
    }

    #dice svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage game__stage--art" id="stage">
      <div id="dice"></div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const DICE_SVG = {
      1: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 90 90" overflow="visible"><style>.a{fill:currentColor}.b{fill:#333;stroke:#333;stroke-width:2px}</style><rect class="a" x="48.82" y="48.82" width="72.44" height="72.44" rx="10" ry="10"/><circle class="b" cx="85.04" cy="85.04" r="4.93"/></svg>',
      2: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 90 90" overflow="visible"><style>.a{fill:currentColor}.b{fill:#333;stroke:#333;stroke-width:2px}</style><rect class="a" x="48.82" y="48.82" width="72.44" height="72.44" rx="10" ry="10"/><circle class="b" cx="103.42" cy="85.04" r="4.93"/><circle class="b" cx="67.1" cy="85.04" r="4.93"/></svg>',
      3: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 90 90" overflow="visible"><style>.a{fill:currentColor}.b{fill:#333;stroke:#333;stroke-width:2px}</style><rect class="a" x="48.82" y="48.82" width="72.44" height="72.44" rx="10" ry="10"/><circle class="b" cx="85.04" cy="85.04" r="4.93"/><circle class="b" cx="107.16" cy="62.91" r="4.93"/><circle class="b" cx="62.91" cy="107.16" r="4.93"/></svg>',
      4: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 90 90" overflow="visible"><style>.a{fill:currentColor}.b{fill:#333;stroke:#333;stroke-width:2px}</style><rect class="a" x="48.82" y="48.82" width="72.44" height="72.44" rx="10" ry="10"/><circle class="b" cx="103.2" cy="67.13" r="4.93"/><circle class="b" cx="66.88" cy="67.13" r="4.93"/><circle class="b" cx="103.2" cy="104.54" r="4.93"/><circle class="b" cx="66.88" cy="104.54" r="4.93"/></svg>',
      5: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 90 90" overflow="visible"><style>.a{fill:currentColor}.b{fill:#333;stroke:#333;stroke-width:2px}</style><rect class="a" x="49.02" y="48.64" width="72.44" height="72.44" rx="10" ry="10"/><circle class="b" cx="103.4" cy="66.95" r="4.93"/><circle class="b" cx="67.07" cy="66.95" r="4.93"/><circle class="b" cx="103.4" cy="104.36" r="4.93"/><circle class="b" cx="67.07" cy="104.36" r="4.93"/><circle class="b" cx="85.24" cy="84.86" r="4.93"/></svg>',
      6: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 90 90" overflow="visible"><style>.a{fill:currentColor}.b{fill:#333;stroke:#333;stroke-width:2px}</style><rect class="a" x="49.04" y="48.82" width="72.44" height="72.44" rx="10" ry="10"/><circle class="b" cx="103.42" cy="67.13" r="4.93"/><circle class="b" cx="67.1" cy="67.13" r="4.93"/><circle class="b" cx="103.42" cy="104.54" r="4.93"/><circle class="b" cx="67.1" cy="104.54" r="4.93"/><circle class="b" cx="103.42" cy="85.04" r="4.93"/><circle class="b" cx="67.1" cy="85.04" r="4.93"/></svg>',
    };

    const dice = document.getElementById('dice');

    function tick(silent) {
      triggerChangeAnimation(dice, silent);
      dice.style.color = IGRO_COLORS[randomColorKey()];
      dice.innerHTML = DICE_SVG[randomInt(1, 6)];
    }

    mountGameShell({
      gameId: 'dice',
      titleKey: 'dice',
      tick: tick,
      reset: function () {
        dice.innerHTML = '';
      },
      methodica:
        '<p>На белом фоне появляется кубик с точками от 1 до 6 — каждый раз нового цвета.</p>' +
        '<ul>' +
        '<li>Просите ребёнка посчитать точки и назвать число.</li>' +
        '<li>Пусть ребёнок покажет столько же пальчиков.</li>' +
        '<li>Найдите такой же кубик или карточку с числом.</li>' +
        '<li>Отхлопайте столько раз, сколько точек на кубике.</li>' +
        '<li>Назовите цвет кубика — пусть ребёнок найдёт предмет такого цвета.</li>' +
        '<li>Играйте в настольную игру: сколько выпало, столько шагов вперёд.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
