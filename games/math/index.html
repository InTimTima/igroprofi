<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Математика — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    .math-stage {
      display:flex; align-items:center; justify-content:center;
      width:100%; height:100%; padding:6.5rem 1rem 1rem;
    }
    .math-expr {
      font-size: min(18vw, 84px);
      font-weight: 800;
      color: var(--text);
      line-height:1;
      user-select: none;
      text-align:center;
    }
    .math-expr span.op { color: var(--sea-dark); }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>
  <div class="game">
    <div class="game__stage" id="stage">
      <div class="math-stage"><div class="math-expr" id="expr"></div></div>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>
  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    let mode='add'; // add | sub | mixed
    const exprEl=document.getElementById('expr');
    function genAdd(){
      // a+b <=10, a,b 1..10
      let a = randomInt(1,9);
      let b = randomInt(1, 10-a);
      if (b<1) b=1;
      return { a, b, op: '+', res: a+b };
    }
    function genSub(){
      let a = randomInt(2,10);
      let b = randomInt(1, a-1);
      return { a, b, op: '−', res: a-b };
    }
    function tick(silent){
      const mathStage=document.querySelector('.math-stage');
      triggerChangeAnimation(mathStage, silent);
      let p;
      if(mode==='add') p=genAdd();
      else if(mode==='sub') p=genSub();
      else p = Math.random()<0.5 ? genAdd() : genSub();
      exprEl.innerHTML = p.a + ' <span class="op">' + p.op + '</span> ' + p.b + ' = ?';
      exprEl.dataset.answer = p.res;
    }
    function createMathControl(container){
      const wrapper=document.createElement('div');
      wrapper.className='control-group';
      const label=document.createElement('label');
      label.className='control-label';
      label.textContent='Режим';
      const slider=document.createElement('input');
      slider.type='range'; slider.min='0'; slider.max='2'; slider.step='1'; slider.value='0';
      const ticks=document.createElement('div');
      ticks.className='speed-ticks';
      const labels=['+','−','±'];
      const keys=['mathAdd','mathSub','mathMixed'];
      labels.forEach((txt,i)=>{
        const s=document.createElement('span');
        s.textContent=t(txt); ticks.appendChild(s);
      });
      function t(k){ return typeof window.t==='function'? window.t(k) : k; }
      slider.addEventListener('input', function(){
        const v=Number(slider.value);
        mode = v===0?'add': v===1?'sub':'mixed';
        if(Interactive.active) tick(false);
      });
      wrapper.append(label, slider, ticks);
      container.appendChild(wrapper);
    }
    mountGameShell({
      gameId: 'math',
      titleKey: 'math',
      tick: tick,
      reset: function(){ exprEl.textContent=''; },
      setupControls: function(startCol,endCol){
        createMathControl(endCol);
      },
      methodica:
        '<p>На экране — простые примеры с числами 1–10.</p>' +
        '<ul>' +
        '<li>Режим «сложение» — примеры вида 3 + 4</li>' +
        '<li>Режим «вычитание» — примеры вида 7 − 2</li>' +
        '<li>Режим «сложение / вычитание» — случайные примеры</li>' +
        '<li>Просите ребёнка назвать ответ, показать столько же предметов, выложить пример кубиками.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
