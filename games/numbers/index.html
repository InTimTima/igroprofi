<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цифры — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    #stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5.5rem 2.75rem 1.5rem;
      transition: background-color 0.35s ease;
    }

    #number {
      font-size: min(32vw, 36vh);
      line-height: 1;
      color: #333333;
      user-select: none;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage" id="stage">
      <span id="number">1</span>
    </div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const numberEl = document.getElementById('number');

    function tick(silent) {
      triggerChangeAnimation(numberEl, silent);
      if (!silent) {
        stage.classList.remove('flash-bg');
        void stage.offsetWidth;
        stage.classList.add('flash-bg');
      }
      stage.style.backgroundColor = IGRO_COLORS[randomColorKey()];
      numberEl.textContent = String(randomInt(1, 5));
    }

    mountGameShell({
      gameId: 'numbers',
      titleKey: 'numbers',
      tick: tick,
      reset: function () {
        stage.style.backgroundColor = '#ffffff';
      },
      methodica:
        '<p>Цвет фона меняется, а поверх него появляются цифры от 1 до 5.</p>' +
        '<ul>' +
        '<li>Просите ребёнка называть цифру и цвет фона.</li>' +
        '<li>Показывайте цифру пальчиком и учите её писать.</li>' +
        '<li>Найдите карточку с такой же цифрой среди разложенных.</li>' +
        '<li>Отсчитайте столько предметов, сколько показывает цифра.</li>' +
        '<li>Прыгайте столько же раз, сколько на экране.</li>' +
        '<li>В цвет фона выполняйте движение: красный — хлопаем, синий — топаем, жёлтый — приседаем, зелёный — прыгаем.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
