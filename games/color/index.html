<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цвет — igroprofi</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <style>
    #stage {
      width: 100%;
      height: 100%;
      transition: background-color 0.35s ease;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../../index.html">← Назад</a>

  <div class="game">
    <div class="game__stage" id="stage"></div>
    <div class="game__controls" id="controls"></div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/shared.js"></script>
  <script>
    const stage = document.getElementById('stage');

    function tick(silent) {
      if (!silent) {
        triggerChangeAnimation(stage);
        stage.classList.remove('flash-bg');
        void stage.offsetWidth;
        stage.classList.add('flash-bg');
      }
      stage.style.backgroundColor = IGRO_COLORS[randomColorKey()];
    }

    mountGameShell({
      gameId: 'color',
      titleKey: 'color',
      tick: tick,
      reset: function () {
        stage.style.backgroundColor = '#ffffff';
      },
      methodica:
        '<p>Предложите ребёнку выполнять задания в зависимости от цвета фона на экране.</p>' +
        '<ul>' +
        '<li>Поднимать предмет того цвета, который на экране.</li>' +
        '<li>Нажимать на кнопочки или звоночки в цвет фона на экране.</li>' +
        '<li>Вставать на коврик в цвет фона на экране.</li>' +
        '<li>Забирать предмет из общей группы в цвет фона на экране.</li>' +
        '<li>Перекладывать предметы по одному в цвет фона на экране.</li>' +
        '<li>Накрывать ладонью предмет в цвет фона на экране.</li>' +
        '<li>Вытаскивать из мешка предмет в цвет фона на экране.</li>' +
        '<li>Зачёркивать, обводить или подчёркивать что-либо в цвет фона на экране.</li>' +
        '<li>Выполнять действия или движения в цвет фона на экране:' +
        '<ul>' +
        '<li>Красный — хлопаем.</li>' +
        '<li>Синий — топаем.</li>' +
        '<li>Жёлтый — приседаем.</li>' +
        '<li>Зелёный — прыгаем.</li>' +
        '</ul>' +
        '</li>' +
        '<li>Строить башню из кубиков или заборчик из палочек, беря по одному элементу в цвет фона на экране.</li>' +
        '<li>Накрывать стаканчиком элемент того цвета, который на экране.</li>' +
        '</ul>',
    });
  </script>
</body>
</html>
